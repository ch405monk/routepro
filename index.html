<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RoutePro - Smart Route Planner</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- LEAFLET MAP ENGINE -->

  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    #map { height: 320px; width: 100%; border-radius: 1rem; z-index: 1; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- APP HEADER WITH NEON LOGO & DARK MODE -->
  <header class="bg-slate-950 text-white shadow-xl sticky top-0 z-50 border-b border-slate-800/80 backdrop-blur-md bg-opacity-95">

      <div class="flex items-center space-x-3">
        <!-- NEON APP LOGO -->
        <div class="w-11 h-11 bg-slate-900 rounded-2xl p-1.5 border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.25)] flex items-center justify-center flex-shrink-0">
          <svg class="w-full h-full" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

                <stop offset="100%" stop-color="#d946ef" />
              </linearGradient>

          </svg>
        </div>
        <div>

            RoutePro <span class="bg-gradient-to-r from-cyan-400 to-fuchsia-500 text-slate-950 text-[10px] font-black uppercase px-1.5 py-0.5 rounded tracking-wide shadow-sm">NEON</span>
          </h1>
          <p class="text-[11px] text-cyan-400/80 font-semibold tracking-wide">Unlimited Multi-Batch Optimizer</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2">
        <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-900 text-amber-400 hover:bg-slate-800 transition border border-slate-700/80 active:scale-95 flex items-center justify-center shadow-sm" title="Toggle Dark/Light Mode">
          <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>
        <select id="mapProviderSelect" onchange="toggleMapProvider()" class="bg-slate-900 text-white text-xs font-bold px-2.5 py-2 rounded-xl border border-slate-700/80 focus:outline-none cursor-pointer">
          <option value="apple">Apple Maps</option>
          <option value="google">Google Maps</option>
        </select>
      </div>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-[61px] z-40 shadow-sm">
    <div class="max-w-4xl mx-auto flex">
      <button onclick="switchTab('active')" id="tab-active" class="flex-1 py-3 text-center text-sm font-bold text-blue-600 dark:text-cyan-400 border-b-2 border-blue-600 dark:border-cyan-400 transition">
        Today's Route (<span id="activeCount">0</span>)
      </button>
      <button onclick="switchTab('library')" id="tab-library" class="flex-1 py-3 text-center text-sm font-bold text-slate-500 dark:text-slate-400 border-b-2 border-transparent hover:text-slate-700 dark:hover:text-slate-200 transition">
        Saved Addresses (<span id="libraryCount">0</span>)
      </button>
      <button onclick="switchTab('add')" id="tab-add" class="flex-1 py-3 text-center text-sm font-bold text-slate-500 dark:text-slate-400 border-b-2 border-transparent hover:text-slate-700 dark:hover:text-slate-200 transition">
        Add Custom Stop
      </button>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->

          <button onclick="useCurrentGPS()" class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3.5 py-2.5 rounded-xl text-sm font-bold border border-slate-300 dark:border-slate-600 flex items-center gap-1.5 transition active:scale-95">
            <svg class="w-4 h-4 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

      { name: "Dave Chaba", address: "626-23 Ave NE, Calgary", phone: "4037969918", note: "30 min heads up... EVERY VISIT. Has lock on gate", lat: 51.0740, lng: -114.0450 },
      { name: "Brett Karperien", address: "452-25 Ave NE, Calgary", phone: "(587) 938-2010", note: "", lat: 51.0760, lng: -114.0500 },
      { name: "Cory Tang", address: "2044 Chicoutimi Dr NW, Calgary", phone: "4036083350", note: "Check carefully on gravel area", lat: 51.0880, lng: -114.1080 },
      { name: "Falon Perkins", address: "156 Bernard Dr NW, Calgary", phone: "4036898736", note: "MISSED WASTE... spend more time. Use gate on right side of house", lat: 51.1230, lng: -114.1010 },
      { name: "Lorna Spence", address: "713-22 Avenue NW, Calgary", phone: "4038695368", note: "Use gate on left side when facing house", lat: 51.0730, lng: -114.0780 },
      { name: "Robyn Warwaruk Rogers", address: "821-21 Ave NW, Calgary", phone: "4037004477", note: "", lat: 51.0720, lng: -114.0800 },
      { name: "Laura Dupont", address: "236 Huntford Way NE, Calgary", phone: "(403) 969-5901", note: "", lat: 51.1150, lng: -114.0480 },
      { name: "Melanie Ferris", address: "62 Sandringham Way NW, Calgary", phone: "(403) 585-7073", note: "Gate access to right of garage", lat: 51.1270, lng: -114.1240 },
      { name: "Kim Hasson", address: "139 Sandarac Place NW, Calgary", phone: "(403) 466-9336", note: "open black gate in yard for 2nd part of backyard. Growing clover. Extension cord near driveway. BE CAREFUL", lat: 51.1290, lng: -114.1220 },
      { name: "Krista Johnson", address: "24 Capri Ave NW, Calgary", phone: "5872241875", note: "Gate on west side accesses side and back yard", lat: 51.0910, lng: -114.1020 }
    ];

    let library = JSON.parse(localStorage.getItem('routepro_library') || 'null');
    if (!library || library.length === 0) {
      library = mondayManifest;
      localStorage.setItem('routepro_library', JSON.stringify(library));
    }

    let activeRoute = JSON.parse(localStorage.getItem('routepro_active') || '[]');
    let mapProvider = localStorage.getItem('routepro_provider') || 'apple';
    let isDarkMode = localStorage.getItem('routepro_dark') === 'true';
    let leafletMap = null;
    let mapMarkers = [];
    let mapPolyline = null;
    let activeTimers = {}; // stores running timer intervals

    if (isDarkMode || (!('routepro_dark' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      isDarkMode = true;
    }

    document.getElementById('mapProviderSelect').value = mapProvider;

    function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      if (isDarkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      localStorage.setItem('routepro_dark', isDarkMode);
    }

    function saveState() {
      localStorage.setItem('routepro_library', JSON.stringify(library));
      localStorage.setItem('routepro_active', JSON.stringify(activeRoute));
      localStorage.setItem('routepro_provider', mapProvider);
      render();
    }

    function loadSelectedDayManifest() {
      let day = document.getElementById('manifestDaySelect').value;
      if (day === 'monday') {
        library = [...mondayManifest];
      } else if (day === 'friday') {
        library = [...fridayManifest];
      } else {
        library = [...thursdayManifest];
      }
      saveState();
    }

    function reloadDefaultManifest() {
      loadSelectedDayManifest();
      alert('Reset Saved Library!');
    }

    function toggleMapProvider() {
      mapProvider = document.getElementById('mapProviderSelect').value;
      saveState();
    }

    function switchTab(tab) {
      ['active', 'library', 'add'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "flex-1 py-3 text-center text-sm font-bold text-slate-500 dark:text-slate-400 border-b-2 border-transparent hover:text-slate-700 dark:hover:text-slate-200 transition";
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "flex-1 py-3 text-center text-sm font-bold text-blue-600 dark:text-cyan-400 border-b-2 border-blue-600 dark:border-cyan-400 transition";
      
      if (tab === 'active' && leafletMap) {
        setTimeout(() => leafletMap.invalidateSize(), 200);
      }
    }

    function needsNotice(note) {
      if (!note) return false;
      return /30\s*m|head|text|call|phone|notice|min/i.test(note);
    }

    // YARD TIMER FUNCTIONS
    function toggleStopTimer(i) {
      let stop = activeRoute[i];
      if (!stop.timerRunning) {
        // Start timer
        stop.timerRunning = true;
        stop.timerStart = Date.now() - (stop.elapsedTime || 0);
        activeTimers[i] = setInterval(() => {
          let elapsed = Date.now() - stop.timerStart;
          stop.elapsedTime = elapsed;
          let el = document.getElementById(`timer-display-${i}`);
          if (el) el.innerText = formatTime(elapsed);
        }, 1000);
      } else {
        // Stop timer
        stop.timerRunning = false;
        clearInterval(activeTimers[i]);
        delete activeTimers[i];
        // Check personal best
        if (!stop.bestTime || stop.elapsedTime < stop.bestTime) {
          stop.bestTime = stop.elapsedTime;
        }
      }
      saveState();
    }

    function formatTime(ms) {
      let totalSec = Math.floor(ms / 1000);
      let mins = Math.floor(totalSec / 60);
      let secs = totalSec % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function render() {
      document.getElementById('activeCount').innerText = activeRoute.length;
      document.getElementById('libraryCount').innerText = library.length;

      const activeListEl = document.getElementById('activeStopsList');
      if (activeRoute.length === 0) {
        activeListEl.innerHTML = `<div class="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 text-center text-slate-400 text-sm">No active stops. Select addresses from Saved Library to populate your route sequence.</div>`;
      } else {
        activeListEl.innerHTML = activeRoute.map((stop, i) => {
          let hasNotice = needsNotice(stop.note);
          let displayTime = stop.elapsedTime ? formatTime(stop.elapsedTime) : "00:00";
          let bestTimeStr = stop.bestTime ? `🏆 Best: ${formatTime(stop.bestTime)}` : '';
          return `
          <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border ${hasNotice ? 'border-amber-400 dark:border-amber-500/80 shadow-amber-500/10' : 'border-slate-200 dark:border-slate-700'} shadow-sm space-y-3 ${stop.completed ? 'opacity-40 line-through' : ''}">
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-start gap-3">
                <span class="w-7 h-7 rounded-full bg-cyan-100 dark:bg-cyan-950/80 text-cyan-700 dark:text-cyan-300 font-black text-xs flex items-center justify-center flex-shrink-0 mt-0.5 shadow-sm border border-cyan-300/30">${i + 1}</span>
                <div>
                  <div class="font-bold text-slate-900 dark:text-slate-100 text-sm flex items-center gap-2">
                    ${escapeHtml(stop.name || 'Stop ' + (i+1))}
                    ${hasNotice ? `<span class="bg-amber-400 text-slate-950 text-[10px] font-black uppercase px-2 py-0.5 rounded-full flex items-center gap-1 shadow-sm animate-pulse">🔔 Needs Notice</span>` : ''}
                  </div>
                  <div class="text-xs text-slate-600 dark:text-slate-300 font-medium">${escapeHtml(stop.address)}</div>
                  ${stop.phone ? `<div class="text-xs text-blue-600 dark:text-cyan-400 mt-0.5 font-bold"><a href="tel:${escapeHtml(stop.phone)}">${escapeHtml(stop.phone)}</a></div>` : ''}
                  ${stop.note ? `<div class="text-xs ${hasNotice ? 'bg-amber-100 dark:bg-amber-950/80 text-amber-950 dark:text-amber-200 border-amber-300 dark:border-amber-700 font-bold' : 'bg-amber-50 dark:bg-amber-950/50 text-amber-900 dark:text-amber-300 border-amber-200 dark:border-amber-800/60 font-medium'} p-2 rounded-xl border mt-1.5">${escapeHtml(stop.note)}</div>` : ''}
                </div>
              </div>
              
              <!-- REORDER CONTROLS & EDIT -->
              <div class="flex flex-col items-end gap-1 flex-shrink-0">
                <div class="flex gap-1">
                  <button onclick="moveStop(${i}, -1)" ${i === 0 ? 'disabled class="opacity-20"' : 'class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 p-1.5 rounded-lg text-xs font-black"'}>▲</button>
                  <button onclick="moveStop(${i}, 1)" ${i === activeRoute.length - 1 ? 'disabled class="opacity-20"' : 'class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 p-1.5 rounded-lg text-xs font-black"'}>▼</button>
                </div>
                <button onclick="editStop(${i})" class="text-xs text-cyan-600 dark:text-cyan-400 font-bold mt-1">Edit</button>
                <button onclick="removeFromActive(${i})" class="text-xs text-red-500 hover:text-red-700 font-bold">Remove</button>
              </div>
            </div>

            <!-- YARD TIMER & ARRIVED / COMPLETE WORKFLOW -->
            <div class="pt-2 border-t border-slate-100 dark:border-slate-700/60 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
                <span class="text-xs font-bold text-slate-500 dark:text-slate-400">⏱ Yard Timer:</span>
                <span id="timer-display-${i}" class="font-mono font-black text-sm text-cyan-600 dark:text-cyan-400">${displayTime}</span>
                <button onclick="toggleStopTimer(${i})" class="${stop.timerRunning ? 'bg-amber-500 hover:bg-amber-600 text-slate-950' : 'bg-slate-800 dark:bg-slate-700 hover:bg-slate-700 text-white'} text-[11px] font-black px-2.5 py-1 rounded-lg transition active:scale-95 shadow-sm">
                  ${stop.timerRunning ? 'Stop ⏹' : 'Start ▶'}
                </button>
                ${bestTimeStr ? `<span class="text-[10px] text-emerald-500 font-bold ml-1">${bestTimeStr}</span>` : ''}
              </div>

              <button onclick="toggleComplete(${i})" class="${stop.completed ? 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-md'} font-black text-xs px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                ${stop.completed ? 'Completed ✓' : 'Arrived & Complete'}
              </button>
            </div>
          </div>
        `}).join('');
      }

      const libraryListEl = document.getElementById('libraryList');
      if (library.length === 0) {
        libraryListEl.innerHTML = `<div class="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 text-center text-slate-400 text-sm">Library is empty. Tap 'Reset Manifest' to reload default stops.</div>`;
      } else {
        libraryListEl.innerHTML = library.map((item, i) => {
          let hasNotice = needsNotice(item.note);
          return `
          <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-start justify-between gap-3">
            <div class="flex items-start gap-3">
              <input type="checkbox" id="lib-chk-${i}" class="lib-checkbox w-5 h-5 text-cyan-600 rounded mt-0.5 cursor-pointer">
              <div>
                <div class="font-bold text-slate-900 dark:text-slate-100 text-sm flex items-center gap-1.5">
                  ${escapeHtml(item.name || 'Saved Address')}
                  ${hasNotice ? `<span class="bg-amber-400 text-slate-950 text-[9px] font-black uppercase px-1.5 py-0.5 rounded-full">🔔 Call/Text</span>` : ''}
                </div>
                <div class="text-xs text-slate-600 dark:text-slate-300 font-medium">${escapeHtml(item.address)}</div>
                ${item.phone ? `<div class="text-xs text-blue-600 dark:text-cyan-400 font-semibold">${escapeHtml(item.phone)}</div>` : ''}
                ${item.note ? `<div class="text-xs text-amber-800 dark:text-amber-400 mt-1 font-medium">${escapeHtml(item.note)}</div>` : ''}
              </div>
            </div>
            <button onclick="removeFromLibrary(${i})" class="text-xs text-red-500 hover:text-red-700 font-bold">Delete</button>
          </div>
        `}).join('');
      }

      renderBatchButtons();
      updateMap();
    }

    function editStop(i) {
      let stop = activeRoute[i];
      let newName = prompt("Edit Customer Name:", stop.name || "");
      if (newName === null) return;
      let newAddress = prompt("Edit Street Address:", stop.address || "");
      if (newAddress === null) return;
      let newPhone = prompt("Edit Phone Number:", stop.phone || "");
      if (newPhone === null) return;
      let newNote = prompt("Edit Special Instructions / Notes:", stop.note || "");
      if (newNote === null) return;

      activeRoute[i] = {
        ...stop,
        name: newName.trim(),
        address: newAddress.trim(),
        phone: newPhone.trim(),
        note: newNote.trim()
      };
      saveState();
    }

    function moveStop(index, direction) {
      let targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= activeRoute.length) return;
      let temp = activeRoute[index];
      activeRoute[index] = activeRoute[targetIndex];
      activeRoute[targetIndex] = temp;
      saveState();
    }

    function renderBatchButtons() {
      const container = document.getElementById('batchButtonsList');
      const uncompleted = activeRoute.filter(s => !s.completed);
      
      if (uncompleted.length === 0) {
        document.getElementById('batchCountText').innerText = "0";
        container.innerHTML = `<div class="text-xs text-slate-400 italic col-span-2">No active stops ready for deployment. Add stops from library above.</div>`;
        return;
      }

      const batchSize = 10;
      const totalBatches = Math.ceil(uncompleted.length / batchSize);
      document.getElementById('batchCountText').innerText = totalBatches;

      let html = '';
      for (let b = 0; b < totalBatches; b++) {
        let startIdx = b * batchSize;
        let endIdx = Math.min((b + 1) * batchSize, uncompleted.length);
        let batchStops = uncompleted.slice(startIdx, endIdx);

        html += `
          <button onclick="deployBatch(${b})" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold p-3 rounded-xl shadow border border-emerald-500/30 flex items-center justify-between transition active:scale-95">
            <div class="text-left">
              <div class="text-xs uppercase font-black tracking-wide text-emerald-200">Batch ${b + 1} (${startIdx + 1}–${endIdx})</div>
              <div class="text-[11px] font-medium text-white/90 truncate max-w-[200px]">${escapeHtml(batchStops[0].name)} ➔ ${escapeHtml(batchStops[batchStops.length - 1].name)}</div>
            </div>
            <span class="bg-white/20 text-white text-[10px] font-black px-2 py-1 rounded-lg uppercase">Launch ${mapProvider === 'apple' ? 'Apple' : 'Google'}</span>
          </button>
        `;
      }
      container.innerHTML = html;
    }

    function deployBatch(batchIdx) {
      const uncompleted = activeRoute.filter(s => !s.completed);
      if (uncompleted.length === 0) return alert('No active stops to navigate.');

      const batchSize = 10;
      let startIdx = batchIdx * batchSize;
      let endIdx = Math.min((batchIdx + 1) * batchSize, uncompleted.length);
      let batchStops = uncompleted.slice(startIdx, endIdx);

      let startOrigin = (batchIdx === 0) 
        ? encodeURIComponent(document.getElementById('startLocation').value || 'Copperfield, Calgary SE')
        : encodeURIComponent(uncompleted[startIdx - 1].address);

      let destination = encodeURIComponent(batchStops[batchStops.length - 1].address);

      if (mapProvider === 'apple') {
        let waypoints = batchStops.slice(0, -1).map(s => encodeURIComponent(s.address)).join('&daddr=');
        let url = `http://maps.apple.com/?saddr=${startOrigin}&daddr=${waypoints}&daddr=${destination}`;
        window.open(url, '_blank');
      } else {
        let waypoints = batchStops.slice(0, -1).map(s => encodeURIComponent(s.address)).join('|');
        let url = `https://www.google.com/maps/dir/?api=1&origin=${startOrigin}&destination=${destination}`;
        if (waypoints) url += `&waypoints=${waypoints}`;
        window.open(url, '_blank');
      }
    }

    function initMap() {
      leafletMap = L.map('map').setView([50.9300, -113.9300], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
      }).addTo(leafletMap);
    }

    function updateMap() {
      if (!leafletMap) return;
      mapMarkers.forEach(m => leafletMap.removeLayer(m));
      mapMarkers = [];
      if (mapPolyline) leafletMap.removeLayer(mapPolyline);

      if (activeRoute.length === 0) return;

      let latLngs = [];
      activeRoute.forEach((stop, i) => {
        let lat = stop.lat || (50.9200 + (i * 0.001));
        let lng = stop.lng || (-113.9300 + (i * 0.001));
        latLngs.push([lat, lng]);

        let hasNotice = needsNotice(stop.note);
        let iconHtml = `
          <div style="background-color:${stop.completed ? '#64748b' : (hasNotice ? '#f59e0b' : '#06b6d4')}; color:#0f172a; font-weight:900; font-size:11px; width:26px; height:26px; border-radius:50%; border:2px solid #ffffff; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.4);">
            ${stop.completed ? '✓' : (hasNotice ? '🚩' : (i + 1))}
          </div>
        `;
        let customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [26, 26] });

        let marker = L.marker([lat, lng], { icon: customIcon }).addTo(leafletMap)
          .bindPopup(`<b>Stop #${i+1}: ${escapeHtml(stop.name)}</b><br>${escapeHtml(stop.address)}`);
        mapMarkers.push(marker);
      });

      mapPolyline = L.polyline(latLngs, { color: '#06b6d4', weight: 4, opacity: 0.8, dashArray: '6, 8' }).addTo(leafletMap);
      leafletMap.fitBounds(mapPolyline.getBounds(), { padding: [30, 30] });
    }

    function clearActiveRoute() {
      if (confirm('Clear all stops from Today\'s Route?')) {
        activeRoute = [];
        saveState();
      }
    }

    function toggleSelectAllLibrary(masterChk) {
      document.querySelectorAll('.lib-checkbox').forEach(chk => {
        chk.checked = masterChk.checked;
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function addSingleAddress() {
      const name = document.getElementById('addName').value.trim();
      const address = document.getElementById('addAddress').value.trim();
      const phone = document.getElementById('addPhone').value.trim();
      const note = document.getElementById('addNote').value.trim();

      if (!address) return alert('Please enter an address.');

      library.push({ name, address, phone, note });
      document.getElementById('addName').value = '';
      document.getElementById('addAddress').value = '';
      document.getElementById('addPhone').value = '';
      document.getElementById('addNote').value = '';
      saveState();
      switchTab('library');
    }

    function addSelectedToActiveRoute() {
      library.forEach((item, i) => {
        const chk = document.getElementById(`lib-chk-${i}`);
        if (chk && chk.checked) {
          activeRoute.push({ ...item, completed: false, elapsedTime: 0, timerRunning: false, bestTime: null });
          chk.checked = false;
        }
      });
      const masterChk = document.getElementById('selectAllLib');
      if (masterChk) masterChk.checked = false;
      
      saveState();
      switchTab('active');
    }

    function toggleComplete(i) {
      activeRoute[i].completed = !activeRoute[i].completed;
      // Stop timer if completed
      if (activeRoute[i].completed && activeRoute[i].timerRunning) {
        toggleStopTimer(i);
      }
      saveState();
    }

    function removeFromActive(i) {
      if (activeTimers[i]) {
        clearInterval(activeTimers[i]);
        delete activeTimers[i];
      }
      activeRoute.splice(i, 1);
      saveState();
    }

    function removeFromLibrary(i) {
      library.splice(i, 1);
      saveState();
    }

    function useCurrentGPS() {
      if (!navigator.geolocation) return alert('Geolocation is not supported on this browser.');
      navigator.geolocation.getCurrentPosition(
        pos => {
          document.getElementById('startLocation').value = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
        },
        err => alert('Unable to retrieve GPS coordinates.')
      );
    }

    // SPATIAL HAVERSINE 2-OPT OPTIMIZATION ENGINE
    function optimizeRoute() {
      if (activeRoute.length < 2) return alert('Add at least 2 stops to optimize.');

      function haversineDist(a, b) {
        let lat1 = a.lat || 50.9300, lon1 = a.lng || -113.9300;
        let lat2 = b.lat || 50.9300, lon2 = b.lng || -113.9300;
        let R = 6371;
        let dLat = (lat2 - lat1) * Math.PI / 180;
        let dLon = (lon2 - lon1) * Math.PI / 180;
        let sa = Math.sin(dLat/2) * Math.sin(dLat/2) +
                 Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                 Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(sa), Math.sqrt(1-sa));
      }

      let unvisited = [...activeRoute];
      let route = [unvisited.shift()];

      while (unvisited.length > 0) {
        let last = route[route.length - 1];
        let nearestIdx = 0;
        let minDist = Infinity;
        for (let i = 0; i < unvisited.length; i++) {
          let d = haversineDist(last, unvisited[i]);
          if (d < minDist) {
            minDist = d;
            nearestIdx = i;
          }
        }
        route.push(unvisited.splice(nearestIdx, 1)[0]);
      }

      let improved = true;
      let iterations = 0;
      while (improved && iterations < 50) {
        improved = false;
        iterations++;
        for (let i = 1; i < route.length - 2; i++) {
          for (let j = i + 1; j < route.length - 1; j++) {
            let currentDist = haversineDist(route[i - 1], route[i]) + haversineDist(route[j], route[j + 1]);
            let newDist = haversineDist(route[i - 1], route[j]) + haversineDist(route[i], route[j + 1]);
            if (newDist < currentDist) {
              let reversedSegment = route.slice(i, j + 1).reverse();
              route.splice(i, reversedSegment.length, ...reversedSegment);
              improved = true;
            }
          }
        }
      }

      activeRoute = route;
      saveState();
      alert(`Master route optimized across all ${activeRoute.length} stops!`);
    }

    window.onload = function() {
      initMap();
      render();
    };
  </script>
